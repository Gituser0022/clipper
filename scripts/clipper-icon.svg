<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS app icon: the same ink tile and scissors as clipper/static/icon.svg,
       drawn as a rounded tile on Apple's icon grid (824px tile, 100px margin). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e2e2e"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".08"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#g)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#fff" stroke-opacity=".06"/>
  <svg x="100" y="100" width="824" height="824" viewBox="0 0 100 100">
    <g transform="rotate(90 50 50) translate(0 2)" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="38.5" cy="69" r="8.5" stroke-width="4.6"/>
      <circle cx="61.5" cy="69" r="8.5" stroke-width="4.6"/>
      <path d="M43.6 62.4 L62.5 19.5" stroke-width="5.2"/>
      <path d="M56.4 62.4 L37.5 19.5" stroke-width="5.2"/>
      <circle cx="50" cy="45.6" r="1.9" fill="#1a1a1a" stroke="none"/>
    </g>
  </svg>
</svg>
